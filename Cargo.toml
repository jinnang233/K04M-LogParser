[package]
name = "k04m-log-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Krypt04Mcg Minecraft log fragment reassembler, binary packet viewer, and JSON exporter"
license = "Unlicense"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flate2 = "1"
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
