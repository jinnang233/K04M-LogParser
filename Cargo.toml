[package]
name = "k04m-log-parser"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Krypt04Mcg Minecraft log/capture parser, packet viewer, private-key and stream decryptor, and JSON exporter"
license = "Unlicense"

[dependencies]
aes-gcm = "0.11"
base64 = "0.22"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "std"] }
ed448-goldilocks-plus = { version = "0.18", default-features = false, features = ["signing", "std"] }
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flate2 = "1"
hkdf = "0.13"
hmac = "0.13"
mc_protocol = { version = "2.4", default-features = false, features = ["compression"] }
# 4.2.0+26.3: Minecraft 26.3 / protocol 777 packet identifiers.
minecraft_data = "=4.2.0"
ml-kem = "0.3"
ml-dsa = "0.1"
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sha3 = "0.12"
# sha3 0.12 dropped the SHAKE types; the BC composite suite needs SHAKE256.
sha3_11 = { package = "sha3", version = "0.11" }
slh-dsa = "0.2.0-rc.5"
spki = "0.8"
tcpstreams = "0.1.3"
uuid = "1"
x25519-dalek = { version = "3", features = ["static_secrets"] }
x448 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[profile.release]
lto = "thin"
strip = true
